{% extends "base.html" %}

{% block title %}Create an Account - BlogVerse{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-200 mx-auto mb-4">
      <i class="fa-solid fa-feather-pointed text-2xl"></i>
    </div>
    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Create your account</h2>
    <p class="mt-2 text-xs sm:text-sm text-slate-500">
      Already have an account? <a href="/login{% if redirect_url %}?redirect={{ redirect_url }}{% endif %}" class="font-bold text-indigo-600 hover:text-indigo-500">Sign in here</a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4">
    <div class="bg-white py-8 px-6 shadow-xl shadow-slate-100 rounded-3xl border border-slate-200/80 sm:px-10">
      
      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
          <input 
            id="username" 
            name="username" 
            type="text" 
            required 
            placeholder="johndoe" 
            pattern="^[a-zA-Z0-9_-]+$"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition"
          >
          <p class="text-[11px] text-slate-400 mt-1">Letters, numbers, underscores, and dashes only.</p>
        </div>

        <div>
          <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input 
            id="email" 
            name="email" 
            type="email" 
            required 
            placeholder="john@example.com" 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition"
          >
        </div>

        <div>
          <label for="full_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name (Optional)</label>
          <input 
            id="full_name" 
            name="full_name" 
            type="text" 
            placeholder="John Doe" 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition"
          >
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            required 
            minlength="6"
            placeholder="Minimum 6 characters" 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition"
          >
        </div>

        <div>
          <label for="bio" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Author Bio (Optional)</label>
          <textarea 
            id="bio" 
            name="bio" 
            rows="2" 
            placeholder="A brief intro about what you write about..." 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition resize-none"
          ></textarea>
        </div>

        <div id="error-box" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

        <div class="pt-2">
          <button 
            type="submit" 
            id="register-btn" 
            class="w-full flex justify-center items-center space-x-2 py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition"
          >
            <i class="fa-solid fa-user-plus text-xs"></i>
            <span>Create Account</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const REDIRECT_URL = "{{ redirect_url or '/dashboard' }}";

  async function handleRegister(e) {
    e.preventDefault();
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('register-btn');
    errorBox.classList.add('hidden');

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const full_name = document.getElementById('full_name').value.trim();
    const password = document.getElementById('password').value;
    const bio = document.getElementById('bio').value.trim();

    submitBtn.disabled = true;

    try {
      const response = await fetch('/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username,
          email,
          full_name: full_name || null,
          password,
          bio: bio || null
        })
      });

      const data = await response.json();

      if (!response.ok) {
        let msg = data.detail;
        if (Array.isArray(msg)) {
          msg = msg.map(m => m.msg).join(', ');
        }
        throw new Error(msg || 'Registration failed.');
      }

      localStorage.setItem('access_token', data.access_token);
      showToast('Account created successfully!');

      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 500);

    } catch (err) {
      errorBox.innerText = err.message;
      errorBox.classList.remove('hidden');
      submitBtn.disabled = false;
    }
  }
</script>
{% endblock %}
